    <script>
      (function() {
        try {
          // Soporte SPA para GitHub Pages u hostings estáticos sin reescritura directa
          var params = new URLSearchParams(window.location.search);
          var spaPath = params.get('spa_path');
          var isGithub = window.location.hostname.indexOf('github.io') !== -1;
          var segments = window.location.pathname.split('/').filter(Boolean);
          var repoBase = (isGithub && segments.length > 0 && segments[0].toLowerCase() !== 'enyo' && segments[0].toLowerCase() !== 'enjo') ? '/' + segments[0] : '';

          if (spaPath) {
            spaPath = decodeURIComponent(spaPath);
            var cleanSub = spaPath.startsWith('/') ? spaPath : '/' + spaPath;
            window.history.replaceState(null, '', repoBase + cleanSub);
          }

          // Asegurar que la imagen del logo y la URL en OpenGraph apunten al dominio actual al compartir desde navegador móvil
          var absLogoUrl = window.location.origin + repoBase + '/android-chrome-512x512.png';
          var ogImg = document.querySelector('meta[property="og:image"]');
          var ogImgSecure = document.querySelector('meta[property="og:image:secure_url"]');
          var twImg = document.querySelector('meta[name="twitter:image"]');
          var itemImg = document.querySelector('meta[itemprop="image"]');
          var linkImg = document.querySelector('link[rel="image_src"]');
          var ogUrl = document.querySelector('meta[property="og:url"]');
          if (ogImg) ogImg.setAttribute('content', absLogoUrl);
          if (ogImgSecure) ogImgSecure.setAttribute('content', absLogoUrl);
          if (twImg) twImg.setAttribute('content', absLogoUrl);
          if (itemImg) itemImg.setAttribute('content', absLogoUrl);
          if (linkImg) linkImg.setAttribute('href', absLogoUrl);
          if (ogUrl) ogUrl.setAttribute('content', window.location.href);

          // Prevenir indexación si la URL contiene /enyo o /enjo
          var p = window.location.pathname.toLowerCase();
          var h = window.location.hash.toLowerCase();
          var s = window.location.search.toLowerCase();
          if (p.indexOf('enyo') !== -1 || h.indexOf('enyo') !== -1 || s.indexOf('enyo') !== -1 ||
              p.indexOf('enjo') !== -1 || h.indexOf('enjo') !== -1 || s.indexOf('enjo') !== -1) {
            var meta = document.createElement('meta');
            meta.name = 'robots';
            meta.content = 'noindex, nofollow, noarchive, nosnippet';
            document.head.appendChild(meta);
          }

          // Clear any old testing flag in localStorage
          localStorage.removeItem('tpv-theme');
          var userTheme = sessionStorage.getItem('tpv-theme');
          if (userTheme === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
