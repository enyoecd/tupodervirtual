    <link rel="manifest" href="/site.webmanifest" />
    <link rel="shortcut icon" href="/favicon.ico?v=7" />
    <meta name="description" content="Tu Poder Virtual: Desarrollo Web Profesional, Menús Digitales para Restaurantes y Soporte Técnico Computacional en Antofagasta, Chile. Atención presencial y asistencia remota con efectos visuales Matrix en modo oscuro y claro." />
    <meta property="og:title" content="Tu Poder Virtual | Desarrollo Web & Soporte Técnico en Antofagasta" />
    <meta property="og:description" content="Tu Poder Virtual: Desarrollo Web Profesional, Menús Digitales para Restaurantes y Soporte Técnico Computacional en Antofagasta, Chile. Atención presencial y asistencia remota con efectos visuales Matrix en modo oscuro y claro." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          // Soporte SPA para GitHub Pages u hostings estáticos sin reescritura directa
          var params = new URLSearchParams(window.location.search);
          var spaPath = params.get('spa_path');
          if (spaPath) {
            spaPath = decodeURIComponent(spaPath);
            var isGithub = window.location.hostname.indexOf('github.io') !== -1;
            var segments = window.location.pathname.split('/').filter(Boolean);
            var repoBase = (isGithub && segments.length > 0 && segments[0].toLowerCase() !== 'enyo' && segments[0].toLowerCase() !== 'enjo') ? '/' + segments[0] : '';
            var cleanSub = spaPath.startsWith('/') ? spaPath : '/' + spaPath;
            window.history.replaceState(null, '', repoBase + cleanSub);
          }

          // Prevenir indexación si la URL contiene /enyo o /enjo
          var p = window.location.pathname.toLowerCase();
          var h = window.location.hash.toLowerCase();
          var s = window.location.search.toLowerCase();
          if (p.indexOf('enyo') !== -1 || h.indexOf('enyo') !== -1 || s.indexOf('enyo') !== -1 ||
              p.indexOf('enjo') !== -1 || h.indexOf('enjo') !== -1 || s.indexOf('enjo') !== -1) {
            var meta = document.createElement('meta');
            meta.name = 'robots';
            meta.content = 'noindex, nofollow, noarchive, nosnippet';
            document.head.appendChild(meta);
          }

          // Clear any old testing flag in localStorage
          localStorage.removeItem('tpv-theme');
          var userTheme = sessionStorage.getItem('tpv-theme');
          if (userTheme === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-white dark:bg-[#0B0F17] text-slate-800 dark:text-slate-100 font-sans antialiased selection:bg-pink-900 selection:text-pink-100 transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
